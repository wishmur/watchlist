  input:
    title: Applied AI Engineer, Federal - Top Secret Clearance
    location: New York City, NY (Hybrid); San Francisco, CA (Hybrid); United States (Remote)
    raw_jd: '&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;About Snorkel&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;At Snorkel, we believe meaningful AI doesn’t start with the model, it starts with the data.&lt;/p&gt;
      &lt;p&gt;We’re on a mission to help enterprises transform expert knowledge into specialized AI at
      scale. The AI landscape has gone through incredible changes since 2015, when Snorkel started as
      a research project in the Stanford AI Lab, to the generative AI breakthroughs of today. But one
      thing has remained constant: the data you use to build AI is the key to achieving differentiation,
      high performance, and production-ready systems. We work with some of the world’s largest organizations
