      &lt;p&gt;&lt;strong&gt;What you’ll own&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We&#39;re looking for a
      product leader for the core surface area of Hightouch: the interfaces marketers live in every day
      and the largest driver of our revenue. You&#39;ll own a broad portfolio spanning:&lt;/p&gt; &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Audiences — &lt;/strong&gt;the segmentation and targeting experience at
      the center of Hightouch&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Charts &amp;amp; Dashboards — &lt;/strong&gt;analytics
