    job_title: Senior Product Manager, AI
  input:
    title: Senior Product Manager, AI
    location: Canada - Remote (ON, AB, BC, or NS Only)
    raw_jd: '&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;We&#39;re transforming
      the grocery industry&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span class=&quot;im&quot;&gt;At Instacart,
      we invite the world to share love through food because we believe everyone should have access to
      the food they love and more time to enjoy it together. Where others see a simple need for grocery
      delivery, we see exciting complexity and endless opportunity to serve the varied needs of our community.
      We work to deliver an essential service that customers rely on to get their groceries and household
      goods, while also offering safe and flexible earnings opportunities to Instacart Personal Shoppers.&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;Instacart has become a lifeline for millions of people, and we’re building the team to
      help push our shopping cart forward. If you’re ready to do the best work of your life, come join
      our table.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Instacart is a Flex First team &lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;There’s no one-size fits all approach to how we do our best work. Our employees have the
      flexibility to choose where they do their best work—whether it’s from home, an office, or your favorite
      coffee shop—while staying connected and building community through regular in-person events. &lt;a
      href=&quot;https://www.instacart.careers/flex-first&quot; target=&quot;_blank&quot; data-saferedirecturl=&quot;https://www.google.com/url?q=https://instacart.careers/remote/&amp;amp;source=gmail&amp;amp;ust=1651869232122000&amp;amp;usg=AOvVaw37OlxP8hAKN7nq4YwHQH7e&quot;&gt;Learn
      more about our flexible approach to where we work.&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;&lt;strong&gt;Overview&lt;/strong&gt;&lt;/h2&gt;
      &lt;p&gt;Instacart’s AI team is building B2B agentic AI products that help retailers and CPGs recover
      margin by tackling out-of-stock, shrink and waste, and fulfillment utilization. We aim to translate
      cutting-edge AI into practical, trustworthy solutions that move key financial levers for our customers.&lt;/p&gt;
      &lt;p&gt;As a Product Manager, AI, you will own the vision, roadmap, and go-to-market for new agentic
      AI capabilities from 0 to 1. You’ll work backwards from customer outcomes — not technology trends
      — to define clear product requirements, partner closely with engineering and data science to ship
      value quickly, and collaborate with sales and marketing to craft a commercial motion that proves
      impact and scales revenue.&lt;/p&gt; &lt;p&gt;You’ll join a small, focused team (alongside 2 PMs
      and 7 engineers to start) with the mandate and resources to move fast. If you thrive in ambiguity,
      love turning complex data and workflows into simple, outcome-driven products, and want to shape
      how AI transforms retail operations, this role is for you.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;About
      the Job&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Own the product vision, strategy, and roadmap
      for agentic AI solutions that reduce out-of-stocks, shrink and waste, and improve fulfillment utilization
      for retailers and CPGs.&lt;/li&gt; &lt;li&gt;Work backwards from customer outcomes to write crisp
      problem statements, PRDs, and success metrics; prioritize ruthlessly to deliver v0, iterate to v1,
      and scale proven features.&lt;/li&gt; &lt;li&gt;Partner with engineering and data science to scope
      experiments, manage backlogs, define KPIs and evaluation frameworks, and ensure models and agents
      are reliable, safe, and observable.&lt;/li&gt; &lt;li&gt;Lead discovery with customers; design pilots
