  source:
    company_name: Databricks
    job_title: Staff Product Manager, Security
  input:
    title: Staff Product Manager, Security
    location: Seattle, Washington
    raw_jd: '&lt;p&gt;P-1016&lt;/p&gt; &lt;p&gt;At Databricks, we are passionate about helping data teams
      solve the world&#39;s toughest problems — from making the next mode of transportation a reality
      to accelerating the development of medical breakthroughs. We do this by building and running the
      world&#39;s best data and AI infrastructure platform so our customers can use deep data insights
      to improve their business. To achieve our mission, we strive to radically simplify the experience
      of our users as they undertake complex data management projects, while ensuring that we protect
      their data with the highest standards of security.&lt;/p&gt; &lt;p&gt;In this role, you will lead
      all aspects of data security for the Databricks Lakehouse platform. You will drive the product strategy
      to identify, prioritize and deliver both the external and internal controls necessary for customers
      to meet their privacy, confidentiality, digital sovereignty and other regulatory obligations. You
      will create elegant yet simple policy models that enable customers to control access to their most
      important assets. Your work will help IT and security administrators feel at ease with increasing
      Databricks usage in their organization. Our data champions will benefit from the data security and
      operational simplicity you provide, to ensure that they can focus their time on creating most value
      for their users. You will report to a Senior Director of Product management.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The
      impact you will have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Make security a market differentiator
      that enables Databricks to succeed in enterprise and regulated industries.&lt;/li&gt; &lt;li&gt;Help
      Databricks gain the trust of CSO teams of security sensitive customers and qualify the Lakehouse
      platform for all data classes in the customer organization.&lt;/li&gt; &lt;li&gt;Build a vision
      for a best-in-class network and data security policy model that provides secure access to customer
      workloads and data while minimizing exposure to unauthorized access and risk of data loss.&lt;/li&gt;
      &lt;li&gt;Partner with privacy, legal, and security teams to deliver anonymization, retention, and
      residency for regulated data and sensitive assets such as AI models.&lt;/li&gt; &lt;li&gt;Deepen
      our understanding of evolving threats and corresponding technologies in data security. Use customer
      inputs to serve as an expert and propose new innovations or best practices from the industry.&lt;/li&gt;
      &lt;li&gt;Partner with cloud providers and support confidential compute&lt;/li&gt; &lt;li&gt;Rationalize
      and refine the differences in customer experience and data security technologies across multiple
      clouds including Azure, AWS and Google Cloud.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;What
      we look for:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;7+ years of product management experience
      with enterprise B2B or SaaS products, with experience delivering successful customer-facing products/features.&lt;/li&gt;
      &lt;li&gt;Domain expertise in data security, data privacy, and encryption&lt;/li&gt; &lt;li&gt;An
      accomplished senior product manager who can define and deliver on success metrics, summarize customer
      inputs into actionable requirements, and crisply communicate product value propositions to customers
      and sales teams.&lt;/li&gt; &lt;li&gt;Experience partnering with senior engineering leadership with
      an ability to deep-dive into complex technical concepts.&lt;/li&gt; &lt;li&gt;Experience driving
      business results through influential leadership across multiple partner teams including engineering,
      sales, marketing, solution architects and customer success.&lt;/li&gt; &lt;li&gt;Passion for designing
      products that simplify user experience of technically complex products.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;div
      class=&quot;content-pay-transparency&quot;&gt;&lt;div class=&quot;pay-input&quot;&gt;&lt;div class=&quot;description&quot;&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Pay Range Transparency&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;span style=&quot;font-weight:
      400; font-size: 14px;&quot;&gt;Databricks is committed to fair and equitable compensation practices.
      The pay range(s) for this role is listed below and represents the expected salary range for non-commissionable
      roles or on-target earnings for commissionable roles.&amp;nbsp; Actual compensation packages are
      based on several factors that are unique to each candidate, including but not limited to job-related
