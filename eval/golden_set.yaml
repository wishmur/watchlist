      — &lt;/strong&gt;automation and measurement tools to run &amp;amp; monitor cross-channel experiments&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Trait Building — &lt;/strong&gt;no-code interfaces to build custom business
      logic and data attributes to power marketing campaigns&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Orchestration
      — &lt;/strong&gt;primitives for how campaigns and journeys are sequenced and coordinated globally
      across all of Hightouch&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;We need someone who can drive clarity, set
      prioritization, and bring a unifying vision across that entire portfolio.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What
      you’ll do&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The role’s mandate spans multiple modes of product work:
      from 0-1 innovation to deepening established surfaces to scaling emerging areas. A significant part
      of the job will be deciding what to prioritize and what outcomes to achieve in which order to hit
