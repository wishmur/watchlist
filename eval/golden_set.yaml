- id: gs-7cb9bb10
  labeled_by: auto-seed
  needs_review: false
  source:
    company_name: Brick
    job_title: Senior Product Manager
  input:
    title: Senior Product Manager
    location: Chicago, New York City, San Francisco
    raw_jd: '&lt;div class=&quot;content-intro&quot;&gt;&lt;h3 data-section-id=&quot;1omse2h&quot; data-start=&quot;71&quot;
      data-end=&quot;125&quot;&gt;&lt;span&gt;&lt;strong data-start=&quot;75&quot; data-end=&quot;123&quot;&gt;About
      Brick...&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt; &lt;p data-start=&quot;126&quot; data-end=&quot;390&quot;&gt;Brick
      is transforming how people interact with technology—helping people minimize distractions, reclaim
      focus, and live more intentionally. Our physical device and companion app turn smartphones from
      sources of distraction into tools for presence and productivity.&lt;/p&gt; &lt;p data-start=&quot;392&quot;
      data-end=&quot;586&quot;&gt;We’re on a mission to help people take back control of their time and
      attention so they can focus on what matters most—and we’re building a team of thoughtful, driven
      people to make that happen.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Job Summary / About the
      Role:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We&#39;re looking for a &lt;strong&gt;Senior Product Manager&lt;/strong&gt;
      to build delightful software experiences that feel like magic with our hardware. If you enjoy ownership
      of the full arc, from high-level discovery through strategic roadmapping to day-to-day execution,
      this might be a great fit for you.&lt;/p&gt; &lt;p&gt;Our customers want a healthier relationship
      with their digital devices, rediscovering their focus, hobbies, and passions. You&#39;ll work closely
      with them, alongside designers and engineers, to understand the problems they&#39;re facing, prioritize
      the right hypotheses, shape those experiences, and ship them on our platform.&lt;/p&gt; &lt;p&gt;Brick
      is a product-led company, focused on building and selling. Your job is to both sides together to
      create impactful products people love. This is a foundational role in our early-stage company and
      your decisions will directly shape what Brick becomes.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Location:&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;This role is based in Chicago, NYC, or SF. We come together in-person at least three days
      a week for close collaboration time, balanced with deliberate focus time while remote.&amp;nbsp;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What You’ll Do:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own the product
      strategy and roadmap for your area&lt;/li&gt; &lt;li&gt;Be data inspired, translating company-level
      objectives into prioritized hypotheses&lt;/li&gt; &lt;li&gt;Talk to customers, run experiments,
      and become an expert in behavioral change&lt;/li&gt; &lt;li&gt;Empower your engineers and designers
      to move fast and make product decisions by helping them understand user needs&lt;/li&gt; &lt;li&gt;Write
      release messaging and launch plans that resonate, and partner with marketing and operations to plan
