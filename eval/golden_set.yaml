      basis and have the opportunity to grow and reach new dimensions that you could never have imagined.
      We are looking for people who can embrace this challenge, refresh the product at breakneck speed
      and promote PayPay with professionalism and passion.&lt;br&gt;※ Please note that you cannot apply
      or be selected in parallel with PayPay Corporation, PayPay Card Corporation and PayPay Securities
      Corporation.&lt;/p&gt; &lt;p&gt;2018年にサービスを開始してから約8年でユーザー数7500万人を突破したフィンテック企業であるPayPayは約50か国の国と地域から集まった多様なメンバーで構成されています。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;OUR VISION IS UNLIMITED_&lt;/strong&gt;&lt;/p&gt; &lt;div class=&quot;col-sm-9
      col-12 content&quot;&gt; &lt;p&gt;我々は自分たちの想像を超える未来を創るためにあえて明確なビジョンは必要ないと考えています。常にDay1であるスタンスを忘れずに、誰もが想像できないようなビジョン（未来）を実現していくのがPayPayです。&lt;br&gt;この壮大なビジョンに前向きに取り組み、他社に真似できない圧倒的なスピードでプロダクトを磨き上げ、日本のキャッシュレス決済、またそれを使用した金融ライフプラットフォームとしての普及を一気に推進することにプロフェッショナルとして情熱を持って取り組み、自ら課題発見し、周囲と協力して新しい価値創出を共に推進する仲間を募集します。&lt;/p&gt;
      &lt;p&gt;※ PayPay株式会社へご応募いただく際にはPayPayカード株式会社、PayPay証券株式会社へ併願応募はご遠慮いただいております。ご了承ください。&lt;/p&gt;
      &lt;/div&gt; &lt;/div&gt; &lt;h2 class=&quot;col-sm-9 col-12 content&quot;&gt;&amp;nbsp;&lt;/h2&gt;
      &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;div class=&quot;col-sm-9 col-12 content&quot;&gt; &lt;p&gt;&lt;strong&gt;▼関連コンテンツ&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://youtu.be/IU0zLh1Qnuk?si=uWGZhKjV5BPU3zSV&quot;&gt;【PayPayが仕掛ける金融革命】米国ナスダック上場は通過点／デジタル金融プラットフォームに進化／決済・投資・貯蓄・保険などすべてPayPay／内製でシステム開発する理由／グローバル標準の金融サービス&lt;/a&gt;&lt;/p&gt;
      &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;/div&gt; &lt;p&gt;&lt;iframe src=&quot;https://www.youtube.com/embed/hwHBs9V_a4I&quot;
      width=&quot;301&quot; height=&quot;169&quot;&gt;&lt;/iframe&gt;&lt;iframe src=&quot;https://www.youtube.com/embed/DxDjFTeyYaU&quot;
      width=&quot;301&quot; height=&quot;169&quot;&gt;&lt;/iframe&gt;&lt;/p&gt; &lt;h2&gt;&lt;span style=&quot;font-weight:
      bold; text-decoration: underline;&quot;&gt;Job Description&lt;/span&gt;&lt;/h2&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
      &lt;h3&gt;About the Organization/Team・組織/チームについて&lt;/h3&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;Our
      team builds products that transform banking operations through technology, making them more seamless,
      efficient, and user-friendly. These include bank account opening, identity verification (eKYC),
      various operation related procedures, fraud prevention, regulatory compliance, and customer support.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;※ After joining the company, you are expected to be seconded to PayPay Bank
      as a member of the above project.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;配属先組織は、口座開設や本人確認、各種手続き、不正対応、法令対応、カスタマーサポートなどの銀行業務を、テクノロジーによってより便利で効率的なものに変えていくプロダクト開発を行っています。&lt;/p&gt;
      &lt;p&gt;&lt;span style=&quot;text-decoration: underline;&quot;&gt;&lt;a href=&quot;https://speakerdeck.com/paypaycorporation/engineering-for-new-bank-project-recruiting-factbook&quot;&gt;【Engineering
      for New Bank Project】Recruiting Factbook&lt;/a&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;※入社後に上記プロジェクトメンバーとしてPayPay銀行への出向を予定しています。&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h3&gt;Background of Recruitment・募集の背景&lt;/h3&gt; &lt;p&gt;We&#39;re
      expanding our team to strengthen our ability to work closely with business stakeholders, identify
      operational challenges, and drive end-to-end product solutions that create real business impact.&lt;/p&gt;
      &lt;p&gt;業務部門の課題を整理し、プロダクトとして解決まで推進できる体制を強化するため新たなメンバーを募集します。&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
      &lt;h3&gt;Job Responsibilities・具体的な業務内容&lt;/h3&gt; &lt;p&gt;In this role, you will work closely
      with business stakeholders to identify operational challenges and respond to regulatory and policy
      changes. You will define the target state for business processes and products by balancing customer
      experience, operational efficiency, business value, and regulatory compliance, driving solutions
      from concept through implementation.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;D'
