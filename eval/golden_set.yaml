    raw_jd: '&lt;div class=&quot;content-intro&quot;&gt;&lt;div&gt;&lt;strong&gt;About Us&lt;/strong&gt;&lt;/div&gt;
      &lt;div&gt; &lt;p&gt;At Cloudflare, we are on a mission to help build a better Internet. Today the
      company runs one of the world’s largest networks that powers millions of websites and other Internet
      properties for customers ranging from individual bloggers to SMBs to Fortune 500 companies. Cloudflare
      protects and accelerates any Internet application online without adding hardware, installing software,
      or changing a line of code. Internet properties powered by Cloudflare all have web traffic routed
      through its intelligent global network, which gets smarter with every request. As a result, they
      see significant improvement in performance and a decrease in spam and other attacks. Cloudflare
      was named to Entrepreneur Magazine’s Top Company Cultures list and ranked among the World’s Most
      Innovative Companies by Fast Company.&amp;nbsp;&lt;/p&gt; &lt;p&gt;At Cloudflare, we’re not looking
      for people who wait for a polished roadmap; we’re looking for the builders who see the cracks in
      the Internet that everyone else has simply learned to live with. We value candidates who have the
      instinct to spot a &quot;normalized&quot; problem and the AI-native curiosity to create a solution
      using the latest tools. Our culture is built on iteration, leveraging AI to ship faster today to
      make it better tomorrow, while ensuring that every improvement, no matter how small, is shared across
      the team to lift everyone up. If you’re the type of person who values curiosity over bureaucracy,
      and that AI is a partner in solving tough problems to keep the Internet moving forward, you’ll fit
      right in.&lt;/p&gt; &lt;/div&gt;&lt;/div&gt;&lt;h2&gt;Available Locations&lt;/h2&gt; &lt;ul&gt;
      &lt;li&gt;Lisbon (Hybrid)&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About the Role&lt;/h2&gt; &lt;p&gt;AI
      Access is one of two central pillars of Cloudflare&#39;s Act 4 (the other is Agentic Commerce).
      As bot traffic rises and human traffic declines, publishers and service providers lose the ad and
      subscription revenue that funds the open web. Without a new model, the economic incentive to create
      original content may decline or even disappear.&lt;/p&gt; &lt;p&gt;We help Cloudflare&#39;s customers
      embrace the Agentic Web by making their content and services available to AI agents on their terms
      — open to any bot, gated behind payment, or anywhere in between. Help us build a better internet
      by ushering in a new business model for it.&lt;/p&gt; &lt;p&gt;At Cloudflare, performance is about
      results and behaviors. We value curiosity, transparency, empathy, grit, and doing the principled
      thing. We&#39;re distributed by design — this role is based in London or Lisbon, with regular travel
      to partners and team offsites.&lt;/p&gt; &lt;p&gt;Content creators should be compensated for the
      value they create — whether a human or an agent is consuming it. We&#39;re helping build the business
      model for the agentic web. What we ship directly shapes how the AI economy develops over the next
      two to three years. The trade-off: ambiguous, demanding, high expectations. If you want a legible
      PM role at a big company, this isn&#39;t it. If you want to own the product side of a thesis that
      matters, it is.&lt;/p&gt; &lt;h2&gt;Responsibilities&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Drive the strategy
      and roadmap across a suite of products that help content creators protect, value, and earn compensation
      for their work, and adjacent AI Access products&lt;/li&gt; &lt;li&gt;Deliver product specifications,
      prototypes, product positioning, and high-impact launches&lt;/li&gt; &lt;li&gt;Partner with Engineering,
      Design, Research, and GTM to ship at high velocity&lt;/li&gt; &lt;li&gt;Work with Partnerships and
      BD to define the new business model for the open web&lt;/li&gt; &lt;li&gt;Represent the product
      externally with publishers, AI labs, and developers&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Desirable Skills,
      Knowledge, and Experience&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;5+ years as a PM in infrastructure, developer
      tools, or AI/ML.&lt;/li&gt; &lt;li&gt;Developer-facing experience required; data, crawling, or search
      is a strong plus&lt;/li&gt; &lt;li&gt;A strong communicator who is comfortable with ambiguity&lt;/li&gt;
      &lt;li&gt;Technically literate — you don&#39;t need to write Rust, but you should be able to push
      back on a tech lead on the merits of a particular direction&lt;/li&gt; &lt;li&gt;Alignment with
      Cloudflare&#39;s goals and values - learn more on our&lt;a href=&quot;https://www.cloudflare.com/en-gb/careers/&quot;&gt;
      Careers page&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;em&gt;*Nice to have*&lt;/em&gt; Founder or early-stage
      operator background.&lt;/li&gt; &lt;li&gt;&lt;em&gt;*Nice to have*&lt;/em&gt; Content licensing,
      rights, or publishing industry experience.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&amp;nbsp;&lt;/h2&gt;
      &lt;h3&gt;Equity&lt;/h3&gt; &lt;p&gt;This role is eligible to participate in Cloudflare’s equity
      pla'
