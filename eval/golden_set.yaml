    raw_jd: '&lt;h1&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/h1&gt; &lt;p&gt;Abnormal AI is
      seeking a Product Manager (Outbound) to drive our next chapter in Identity. Our existing Account
      Takeover Protection module is established and widely adopted, and we are now expanding that footprint
      via Identity Threat Protection. This role will own the field motion for both products as we build
      toward a more cohesive, unified security experience for our customers.&lt;/p&gt; &lt;p&gt;Outbound
      Product Management (OPM) is R&amp;amp;D&#39;s operating layer in the field, the function that sits
      between what we build and how it performs with customers. That means running structured validation
      before a playbook exists, testing messaging in live customer conversations, and distinguishing a
      real product gap from a positioning or sales-motion gap. You&#39;ll work in close partnership with
      Product Management and Product Marketing—OPM owns the field motion, not the roadmap, but the pattern
      analysis and positioning work you bring back is what keeps both teams calibrated to what&#39;s actually
      happening with customers.&lt;/p&gt; &lt;p&gt;This is not a feedback-intake role. You&#39;ll validate
      that a pattern holds across accounts rather than resting on a single anecdote, and know when a read
      is solid enough to bring back to the cross-functional team versus when it needs more digging. Your
      identity background is what makes this work: you&#39;ll earn the trust of a customer&#39;s security
      team by going deep on IAM, authentication, and access patterns, and translate what you hear into
      something Product and Product Marketing can act on.&lt;/p&gt; &lt;h1&gt;&lt;strong&gt;What You&#39;ll
      Do&lt;/strong&gt;&lt;/h1&gt; &lt;h2&gt;&lt;strong&gt;Near-term&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt;
      &lt;ul&gt; &lt;li&gt;Own the field motion for Identity Threat Protection: demos, deep dives, and
      POVs with prospective and existing customers.&lt;/li&gt; &lt;li&gt;Test and refine messaging hypotheses
      in live deals alongside Sales Engineers, and diagnose competitive loss reasons.&lt;/li&gt; &lt;li&gt;Collaborate
      with PM and PMM to build out a proven, repeatable field playbook, grounded in pattern analysis across
      accounts.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Long-term&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt;
      &lt;li&gt;Lead standing ownership of the identity product area within OPM, carrying it forward permanently
      as the product moves through its lifecycle.&lt;/li&gt; &lt;li&gt;Run adoption diagnostics on identity
      features and support technical evaluations in competitive renewals.&lt;/li&gt; &lt;li&gt;Partner
      with Product Marketing as a standing collaborator on identity messaging and competitive positioning
      as new pressures emerge and the product/competitive landscape shifts.&lt;/li&gt; &lt;/ul&gt; &lt;h1&gt;&lt;strong&gt;Must-Have
      Skills&lt;/strong&gt;&lt;/h1&gt; &lt;ul&gt; &lt;li&gt;4+ years in Product Management or Solutions/Sales
      Engineering, with demonstrated depth in identity security (IAM, IGA, PAM, or SSO/authentication).
      This domain knowledge is a firm requirement; the learning curve in front of a customer&#39;s security
      team is not one we can afford.&lt;/li&gt; &lt;li&gt;Experience working in a pre-launch or early-stage
      product environment before a playbook existed, with a specific program, motion, or deliverable built
      from scratch to show for it.&lt;/li&gt; &lt;li&gt;Strong written and verbal communication; credible
      in front of technical buyers and security teams, equally comfortable in a live customer deep-dive
      and an internal roadmap review.&lt;/li&gt; &lt;li&gt;High operational excellence and ownership:
      you&#39;ve taken a field observation from raw signal to a documented recommendation that a PM or
      GTM team acted on.&lt;/li&gt; &lt;li&gt;Strong analytical skills, with the capacity to reason through
      ambiguous problems and make effective, well-justified recommendations.&lt;/li&gt; &lt;/ul&gt; &lt;h1&gt;&lt;strong&gt;Nice
      to Have&lt;/strong&gt;&lt;/h1&gt; &lt;ul&gt; &lt;li&gt;Direct experience with account takeover (ATO),
      session/privilege abuse, or identity-based attack patterns specifically.&lt;/li&gt; &lt;li&gt;Prior
      involvement in a new-product launch, early-access program, or beta motion.&lt;/li&gt; &lt;li&gt;Experience
      running or presenting in structured cross-functional forums (POV reviews, launch/GTM syncs).&lt;/li&gt;
      &lt;li&gt;Familiarity with identity platforms such as Okta, Microsoft Entra, SailPoint, BeyondTrust,
      or Ping Identity.&lt;/li&gt; &lt;li&gt;Comfort using AI tools to synthesize patterns across large
