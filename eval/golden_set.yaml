      projects that drive customer success and our business growth. Forward Deployed Engineering is part
      of the Field Engineering (FE) organization, the technical arm of Databricks’ customer-facing teams.&amp;nbsp;&lt;/p&gt;
      &lt;p&gt;The TPM position understands our customers’ business goals and can steer technical projects
      from beginning to end with exceptional outcomes. You will start on projects after a statement of
      work is agreed (i.e. post-sales) and will leverage your technical expertise and project management
      skills to navigate customer challenges and deliver with excellence at every stage.This role serves
      as the essential link between the Field Engineering teams and internal groups, including Sales,
      Product, and Engineering.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Key Responsibilities&lt;/strong&gt;&lt;/h3&gt;
      &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Customer Outcomes:&lt;/strong&gt; Own delivering customer outcomes
      for approximately five concurrent customer projects, ensuring high customer satisfaction&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Project Planning: &lt;/strong&gt;Develop detailed technical project plans
      from finalized proposals or statements of work setting specific milestones, objectives, and key
      results.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Project Execution &amp;amp; Risk Management: &lt;/strong&gt;Drive
      measurable weekly progress with detailed tracking and by mitigating risks to project objectives,
      ensuring projects stay on track.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Stakeholder Management: &lt;/strong&gt;Facilitate
      effective meetings across technical and non-technical stakeholders, from engineering standups to
