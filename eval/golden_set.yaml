    raw_jd: '&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;Why join us&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;Brex is the intelligent finance platform that enables companies to spend smarter and move
      faster in more than 200 markets. By combining global corporate cards and banking with intuitive
      spend management, bill pay, and travel software, Brex enables founders and finance teams to accelerate
      operations, gain real-time visibility, and control spend effortlessly. Brex’s AI-native automation
      and world-class service eliminate manual expense and accounting tasks for customers so they can
      focus on what matters most. Tens of thousands of the world&#39;s best companies run on Brex, including
      DoorDash, Coinbase, Robinhood, Zoom, Plaid, Reddit, and SeatGeek.&lt;/p&gt; &lt;p&gt;Working at
      Brex allows you to push your limits, challenge the status quo, and collaborate with some of the
      brightest minds in the industry. We’re committed to building a diverse team and inclusive culture
      and believe your potential should only be limited by how big you can dream. We make this a reality
      by empowering you with the tools, resources, and support you need to grow your career.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;&lt;strong&gt;Product
      at Brex&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;The Product team is at the forefront of Brex&#39;s mission
      to empower employees anywhere to make better financial decisions. With a deep understanding of the
      business, we identify and scope the most impactful opportunities for Brex to tackle. We align cross-functional
