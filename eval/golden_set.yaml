description: 'Classification golden set for the public PM board. Measures the is_pm_role decision, not
  fit. Seeded from real open postings in the production jobs table, oversampling the FDE/solutions false
  positives that dominated the previous board. Labels marked labeled_by: auto-seed come from unambiguous
  title evidence; needs_review: true flags rows where Gate 1 itself was uncertain and a human should confirm.'
