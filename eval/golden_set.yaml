    title: Senior Product Manager, Ads Exchange
    location: Remote, USA ; Remote, Canada
    raw_jd: '&lt;h3&gt;About Life360&lt;/h3&gt; &lt;p&gt;Life360’s mission is to keep people close to
      the ones they love. Our category-leading mobile app, Tile tracking devices, and Pet GPS tracker
      empower members to protect the people, pets, and things they care about most with a range of services,
      including location sharing, safe driver reports, and crash detection with emergency dispatch. Life360
      serves approximately 102.4 million monthly active users (MAU), as of June 30, 2026, across more
      than 180 countries.&amp;nbsp;&amp;nbsp;&lt;/p&gt; &lt;p&gt;Life360 delivers peace of mind and enhances
      everyday family life with seamless coordination for all the moments that matter, big and small.
      By continuing to innovate and deliver for our customers, we have become a household name and the
      must-have mobile-based membership for families (and those friends who are basically family).&lt;/p&gt;
      &lt;p&gt;Life360 has more than 500 (and growing!) remote-first employees. For more information,
      please visit &lt;a href=&quot;http://life360.com/&quot;&gt;life360.com&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;&lt;em&gt;Life360
      is a Remote First company, which means a remote work environment will be the primary experience
      for all employees. All positions, unless otherwise specified, can be performed remotely (within
      the US and Canada) regardless of any specified location above.&amp;nbsp;&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt;
      &lt;h4&gt;We are AI Native&lt;/h4&gt; &lt;p&gt;We are building an AI native company where AI is
      an integral part of how we build and operate. AI tool usage during interviews varies by role. You
      may be asked to demonstrate proficiency with AI tools, discuss how you leverage AI, or complete
      interview exercises without AI assistance. Your Recruiter will provide clear guidance as you move
      through the interview process.&lt;/p&gt; &lt;p&gt;Undisclosed use of AI not previously discussed
      with or approved by your Recruiter may impact your candidacy.&lt;/p&gt; &lt;h3&gt;About The Team&lt;/h3&gt;
      &lt;p&gt;Life360 is building the family ads platform, and the Ads Operating Group is where that
      business gets built. We are a combined org spanning Product, Ads Sales &amp;amp; Marketing and Ads
      R&amp;amp;D, with a mandate to grow a high-value, privacy-safe ads business at the intersection
      of location intelligence and family life. The Product team moves fast, operates with a builder&#39;s
      mindset, and is creating infrastructure, partnerships, and revenue that didn&#39;t exist before.
      This role sits at the center of that build, connecting what we make to how we win in the market.&lt;/p&gt;
      &lt;h3&gt;About the Job&lt;/h3&gt; &lt;p&gt;We are looking for a Senior Product Manager to own and
      scale our programmatic advertising exchange and SSP capabilities within Life360’s growing Ads business.
      This role combines deep operational ownership, strategic product leadership, and hands-on collaboration
      across Engineering, Programmatic, Sales, and Partner teams.&lt;/p&gt; &lt;p&gt;You will be the primary
      product owner responsible for the stability, performance, and evolution of our exchange. This includes
      managing day-to-day exchange operations, guiding backlog and roadmap execution, partnering closely
      with Engineering on delivery, and working directly with supply and demand partners to drive optimization
      and growth. You will also own Ad Quality, both on the Exchange and on the L360 app. You will balance
      short-term operational needs and revenue impact with long-term platform scalability, reliability,
