  input:
    title: Product Manager, Integration & Ecosystem
    location: Mountain View, CA
    raw_jd: '&lt;p&gt;&lt;strong&gt;Who we are&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Atoms is building the
      machines that power the next era of progress.&lt;/p&gt; &lt;p&gt;Over the last decade, software
      has transformed the digital world. But the physical world, where food is made, minerals are mined,
      goods are moved, and industries are run, remains far less intelligent, far less efficient, and far
      more constrained. We’re changing that.&lt;/p&gt; &lt;p&gt;Atoms builds Physical AI real-world robots
      for the industries that move civilization forward, starting with food, mining, and transport. Our
      systems are designed to understand, predict, and control the real world with precision, turning
      complex physical operations into something more reliable, more scalable, and more productive.&lt;/p&gt;
      &lt;p&gt;Within Atoms, Otter is building the digital infrastructure for better food. Restaurants
      today face a world where off-premise demand is growing faster than the tools built to support it.
      We help operators simplify complexity, grow their business, and deliver great experiences to every
      guest – wherever they are.&lt;/p&gt; &lt;p&gt;Our platform empowers food businesses of all sizes,
      from local heroes to regional chains and global enterprises. With Otter, restaurants can focus on
      what they do best: serving delicious food to their customers. And as they thrive, we’re helping
      make better food more accessible, reliable, and affordable for everyone.&lt;/p&gt; &lt;p&gt;We are
      roboticists, engineers, operators, and builders. We believe the next great technology companies
      will not only transform information, but the physical systems that shape everyday life.&lt;/p&gt;
      &lt;p&gt;If you want to work on hard problems with real-world impact, join us.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What you&#39;ll do&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;As Product Manager for
      Otter&#39;s Integrations &amp;amp; Ecosystem domain, you&#39;ll own the connectivity engine behind
      every third-party integration in the Otter ecosystem - A system that links Otter to dozens of partner
      platforms and keeps those links authenticated, alive, and reliable at scale. You will&lt;/p&gt;
      &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Define a healthy ecosystem:&lt;/strong&gt; Set the metrics that
      actually matter - usage, attach rate, retention lift, connections health etc and build the reporting
      and instrumentation that tracks ecosystem health&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Own connectivity
      engine roadmap:&lt;/strong&gt; Define and drive the technical roadmap for a single self-healing
      integration engine that sits behind one reliable interface for every third-party connection including
      credential creation and management, session persistence, health monitoring, automated recovery and
      beyond&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Keep connections alive:&amp;nbsp;&lt;/strong&gt;Partner
      with engineering to design systems that survive partner-side auth changes, session expiry etc. before
      they cause failures using adaptive retry, rotation strategies etc that hold success rates high&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Auto-heal broken links:&lt;/strong&gt; Own the detect-and-recover loop for
      when connections do break. Define what &quot;broken&quot; means per integration, instrument the
      signals that catch failures early, and build the flows that re-establish connections automatically&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Scale the partner surface:&amp;nbsp;&lt;/strong&gt;Onboard new partner platforms
      - POS, delivery, payments, inventory, and beyond into the engine. Define the integration contract,
      the connection patterns each partner needs (OAuth/SSO, credential-based, webhook etc), and the certification
      bar every connection clears before going LIVE&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Drive cross-functional
      execution:&lt;/strong&gt; Partner with Engineering, Security, Design, BD, and GTM to balance new
      partner coverage against the reliability, compliance, and legal posture of a system that manages
      credentials and maintains connections at scale&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What we&#39;re looking for&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;8-10
      years of product management experience, with direct ownership of a technical platform, developer
      product, or integrations/connectivity system&lt;/li&gt; &lt;li&gt;Technical fluency in integration
      architecture - OAuth/SSO, credential management, session and token lifecycle, webhook design, and
      bidirectional data sync etc&lt;/li&gt; &lt;li&gt;A track record of owning system reliability at
      scale including defining SLOs, instrumenting health, and driving mean-time-to-recovery down through
      automated healing rather than manual ops&lt;/li&gt; &lt;li&gt;Demonstrated ability to lead cross-functional
      initiatives across Product, Engineering, Security, Design, and BD&lt;/li&gt; &lt;li&gt;Experience
      in restaurants, retail, or a comparably complex vertical is a meaningful advantage&lt;/li&gt; &lt;/ul&gt; '
