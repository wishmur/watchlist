      applied researchers, and technical program managers who connect guests to the right listings across
      every surface and help hosts compete and thrive in our marketplace. We work at the intersection
      of search ranking, recommendations, personalization, and generative AI, and we&#39;re building toward
      a future where Airbnb feels less like a search engine and more like a knowledgeable travel companion
      that understands your needs across your entire trip journey.&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span
      style=&quot;font-family: arial, helvetica, sans-serif; color: rgb(0, 0, 0); font-size: 12pt;&quot;&gt;&lt;strong&gt;The
      Difference You Will Make:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span style=&quot;color:
