    title: Principal Product Manager, Omnichannel CX
    location: United States, Remote
    raw_jd: '&lt;div class=&quot;content-intro&quot;&gt;&lt;h3&gt;Redefine the future of customer experiences.
      One conversation at a time.&lt;/h3&gt; &lt;p&gt;At Nextiva, we’re reimagining how businesses connect,
      bringing together customer experience and team collaboration on a single, conversation centric platform.
      Powered by AI, driven by human innovation.&lt;/p&gt; &lt;p&gt;Our culture is forward thinking, customer
      obsessed and built on the belief that meaningful connections drive better business outcomes. Whether
      it’s through our signature Amazing Service®, the technology we create, or the experiences we cultivate,
      connection is at the core of who we are.&lt;/p&gt; &lt;p&gt;If you’re ready to collaborate with
      incredible people, make an impact, and help businesses everywhere deliver truly amazing experiences,
      this is where you belong.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;hr&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span
      data-ccp-props=&quot;{}&quot;&gt;&lt;span data-ccp-props=&quot;{&amp;quot;335559685&amp;quot;:720}&quot;&gt;&lt;strong&gt;Location:
      &lt;/strong&gt;While this role is open to remote candidates across the United States, team members
      located within 40 miles of our Scottsdale headquarters (9451 E. Via de Ventura, Scottsdale, AZ 85256)
      are expected to work onsite four days per week to support collaboration, speed, and execution. Specific
      scheduling and flexibility will be guided by your leader to support both team collaboration and
      individual productivity.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt; &lt;hr&gt; &lt;p&gt;We&#39;re looking
      for a Senior Product Manager to lead our mid-market customer experience product strategy. This role
      is responsible for defining and delivering the capabilities that help growing businesses and BPO
      operators provide exceptional customer experiences while improving operational efficiency. You&#39;ll
      work directly with customers, partners, and internal teams to identify market opportunities, shape
      product direction, and bring innovative omnichannel and AI-powered experiences to market. As Nextiva
      continues moving up-market, you&#39;ll play a key role in ensuring our platform meets the needs
      of increasingly sophisticated customer service organizations.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What
      You’ll Do:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own the product strategy, roadmap, and
      business outcomes for Nextiva&#39;s mid-market customer experience solutions serving organizations
      with 100–2,500 employees and BPO operators.&lt;/li&gt; &lt;li&gt;Develop a deep understanding of
      customer needs through direct engagement with customers, prospects, internal stakeholders, and market
      research.&lt;/li&gt; &lt;li&gt;Define and prioritize investments across omnichannel engagement,
      shared inboxes, agent workspaces, workflow automation, routing, analytics, and AI-powered productivity
      tools.&lt;/li&gt; &lt;li&gt;Partner with Engineering, Design, Data Science, and GTM teams to deliver
      products from concept through launch and adoption.&lt;/li&gt; &lt;li&gt;Lead product discovery efforts
      to validate opportunities, gather feedback, and ensure solutions solve meaningful customer problems.&lt;/li&gt;
      &lt;li&gt;Drive product launches and adoption strategies that support Nextiva&#39;s growth in the
      mid-market segment.&lt;/li&gt; &lt;li&gt;Establish success metrics and use customer insights, operational
      KPIs, and product telemetry to guide investment decisions.&lt;/li&gt; &lt;li&gt;Collaborate with
      Sales, Marketing, and Customer Success teams to communicate product vision, roadmap priorities,
      and customer value.&lt;/li&gt; &lt;li&gt;Influence executive stakeholders through clear communication,
      strong business cases, and data-driven recommendations.&lt;/li&gt; &lt;li&gt;Leverage AI tools and
      emerging technologies to improve product discovery, prototyping, decision-making, and execution
