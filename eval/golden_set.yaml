      turning AI&#39;s operational blind spots into operational clarity. World&#39;s leading companies
      trust Celonis and its global ecosystem of partners to make their AI agents, people, systems, and
      processes work together, achieving transformational outcomes. We believe there&#39;s a massive opportunity
      to unlock global productivity and sustainability by giving AI the context to understand how every
      business process really works. Join our mission to make processes work for people, companies, and
      the planet.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;The Team:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Solutions
      Architects are vital members of our project teams, often serving as the initial technical point
      of contact for our customers and key technical stakeholders for a successful deployment of Celonis.
      To ensure our customers achieve value, the team drives the technical setup required to leverage
      the full range of Celonis features and functionalities, including process mining, process automation,
      Action Flow, and task mining.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The Role:&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;As a &lt;strong&gt;Senior Solutions Architect&lt;/strong&gt; specializing in containerized
      solutions, you will play a crucial, pioneering role in this new initiative. Your primary focus will
      be leading the deployment of these self-hosted solutions within our complex enterprise customer
      environments.&lt;/p&gt; &lt;p&gt;Given the unique nature of every customer environment, you will
      be the key liaison for translating the customer&#39;s technical requirements to ensure successful
      deployment on the client&#39;s infrastructure and successful integrations with their source systems.
      Furthermore, you will lead discussions on user management and authentication, acting as a technical
      partner to remove any technical barriers to user adoption.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The
      work you’ll do:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;You will serve as the &lt;strong&gt;central technical
      stakeholder&lt;/strong&gt; for successful delivery and onboarding of the Celonis platform for our
      enterprise clients.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Deployment Leadership:&lt;/strong&gt;
      Lead complex technical discussions to analyze customer architecture, recommend optimal containerized
      solutions, and facilitate deployment, expertly managing expectations amidst technical constraints.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Federal Deployment &amp;amp; Security Management: &lt;/strong&gt;Own the
      deployment of containerized applications in environments of certain federal accounts, and work with
      our compliance and security engineering teams to actively maintain&lt;strong&gt; &lt;/strong&gt;&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;POA&amp;amp;Ms.&amp;nbsp;&lt;/strong&gt;&lt;strong&gt;Documentation:&lt;/strong&gt;
      Support documentation efforts capturing new integration and deployment scenarios.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Technical
      Integration:&lt;/strong&gt; Establish data integrations between customer systems and Celonis using
      our built-in extractors, APIs, and python.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Adoption Enablement:&lt;/strong&gt;
      Actively remove technical obstacles to maximize Celonis user adoption, clarifying technical risks
      and necessary trade-offs for stakeholders.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Identity &amp;amp;
      Access Management:&lt;/strong&gt; Guide customers on authentication (SSO), user/group management
      (LDAP), and provisioning best practices, removing technical barriers to adoption.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Platform
      Optimization:&lt;/strong&gt; Promote reusability by discerning between dedicated customer solutions
      and broader platform enhancements, collaborating directly with Celonis Product Development.&lt;/li&gt;
      &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;The qualifications you need:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;
      &lt;li&gt;Proven experience of 5+ years deploying and managing containerized applications on Kubernetes.&amp;nbsp;
      Advanced knowledge with at least one specific Kubernetes distribution (Amazon EKS, Azure AKS, RedHat
      OpenShift, etc).&amp;nbsp; &lt;ul&gt; &lt;li&gt;The candidate should bring a good understanding
      of best practices in deploying, scaling, and maintaining highly available, secure and resilient
      containerized applications on Kubernetes, ensuring efficient resource utilization and operational
      stability.&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;/li&gt; &lt;li&gt;Role requires an active Government
      Clearance (Public Trust, Secret or Top Secret, with 18 months-2 years of remaining eligibility).&lt;/li&gt;
      &lt;li&gt;Proven experience implementing infrastructure as code (IaC, e.g. with Terraform) is required;
      H'
