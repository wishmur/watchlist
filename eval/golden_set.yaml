    raw_jd: '&lt;div class=&quot;content-intro&quot;&gt;&lt;h4&gt;&lt;strong&gt;Join Axon and be a Force
      for Good.&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;At Axon, we’re on a mission to Protect Life. We’re
      explorers, pursuing society’s most critical safety and justice issues with our ecosystem of devices
      and cloud software. Like our products, we work better together. We connect with candor and care,
      seeking out diverse perspectives from our customers, communities and each other.&lt;br&gt;&lt;br&gt;Life
      at Axon is fast-paced, challenging and meaningful. Here, you’ll take ownership and drive real change.
      Constantly grow as you work hard for a mission that matters at a company where you matter.&lt;/p&gt;&lt;/div&gt;&lt;h4&gt;&lt;strong&gt;Your
      Impact &lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;As Senior PM for Mitigation &amp;amp; Threat Management,
      you will own the C2 workflows that turn drone detections into coordinated responses. You&#39;ll
      partner with engineering, design, and field teams to ship the tools operators use to neutralize
      threats — kinetic and non-kinetic — at stadiums, bases, borders, and critical facilities worldwide.
      This is one of the highest-leverage PM seats at Dedrone, sitting at the intersection of real-time
      software, defense workflows, and customer mission outcomes.&lt;/p&gt; &lt;h4&gt;&lt;strong&gt;What
      You’ll Do&amp;nbsp;&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;&lt;strong&gt;Location: &lt;/strong&gt;Onsite
      at our Sterling, VA office 4 days a week&lt;br&gt;&lt;strong&gt;Reports&lt;/strong&gt; to: VP of
      Product, Dedrone&lt;br&gt;&lt;strong&gt;Direct Reports:&lt;/strong&gt; N/A&lt;/p&gt; &lt;ul&gt;
      &lt;li&gt;Own the Mitigation &amp;amp; Threat Management product surface end-to-end: vision, roadmap,
      requirements, launch&lt;/li&gt; &lt;li&gt;Work closely with Software Engineering, Data Science,
      UX / Design, and QA teams to ship response workflows that hold up under real-world operator pressure&lt;/li&gt;
      &lt;li&gt;Partner with the Kinetic &amp;amp; Novel Defeat team on integrated response options&lt;/li&gt;
      &lt;li&gt;Drive customer validation through direct engagement with law enforcement, military, and
      critical-infrastructure operators&lt;/li&gt; &lt;li&gt;Implement AI agents to reinvent how you ship
      products and 10x your product team’s effectiveness&lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;&lt;strong&gt;What
      You Bring&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;7+ years of product management experience,
      with 3+ in defense, security, real-time operations, or comparable mission-critical domains&lt;/li&gt;
      &lt;li&gt;A passion for understanding customers’ challenges and objectives and a proven track record
      shipping operator-facing products used under stress&lt;/li&gt; &lt;li&gt;The ability to translate
