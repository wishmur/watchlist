      the US Navy — are using our software to solve some of the most important challenges in the world,
      such as developing new medicines, securing our financial markets, or protecting our country. Backed
      by Sequoia Capital, Coatue Management, NVIDIA, Snowflake and other leading investors, we have been
      in business for over a decade but are still a small team operating with the spirit of a startup.
      In the world of AI today, we believe that the future is still being invented — and we want to be
      the ones building it. For more information, visit &lt;a href=&quot;http://www.domino.ai&quot; target=&quot;_blank&quot;&gt;www.domino.ai&lt;/a&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What your impact will be&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;As a new-grad
      Forward Deployed Engineer at Domino, you will work directly with customers to uncover some of the
      largest challenges to AI adoption in highly regulated industries, and learn how to leverage the
      Domino platform to build solutions for mission-critical business operations. FDEs blend applied
      AI engineering and software engineering skills with customer empathy and domain awareness. You will
      partner with experienced FDEs to move quickly from an ambiguous customer problem to a real solution,
