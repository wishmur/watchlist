      communication skills with the ability to bridge technical and non-technical audiences&lt;/li&gt;
      &lt;li&gt;Working knowledge of counter-UAS, kinetic/non-kinetic response, ITAR, and rules-of-engagement
      concepts&lt;/li&gt; &lt;li&gt;US person (ITAR and U.S. security clearance eligibility required)&lt;/li&gt;
      &lt;/ul&gt; &lt;h4&gt;&lt;strong&gt;Benefits that Benefit You&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt;
      &lt;li&gt;Competitive salary and 401k with employer match&lt;/li&gt; &lt;li&gt;Discretionary paid
