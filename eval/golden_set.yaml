      and they need you to tell them what’s coming and when.&lt;/p&gt; &lt;p&gt;This role suits a hands-on,
      technically fluent PM who wants to ship real integrations, cares about customer product experience,
      and works in an environment where AI is a daily tool rather than a talking point.&lt;/p&gt; &lt;h3&gt;&amp;nbsp;&lt;/h3&gt;
      &lt;h3&gt;&lt;strong&gt;What You&#39;ll Do&lt;/strong&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/h3&gt;
      &lt;h3&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;&lt;strong&gt;Build and deepen integrations&lt;/strong&gt;&lt;/span&gt;&lt;/h3&gt;
