      powers the delivery of every customer communication across the bank. The platform is responsible
      not for the content of communications, but for the technology behind them: enabling teams to quickly
      create new notification types, guaranteeing reliable delivery, connecting new channels, managing
      send logic, and optimizing the cost of delivery across Push, Pop-ups, Banners, SMS, WhatsApp, Email,
      and other channels.&lt;br&gt;This is a product, strategy, and leadership role. You will define a
      single product vision across the platform&#39;s areas — In App Communications, Vendor Channels,
      Notification Center, and Event Operations — while directly owning the development of the In App
      Communications area. You will work at the intersection of product, engineering, and external providers,
      partnering with the product teams across the company that rely on the platform every day.&lt;/div&gt;
      &lt;div&gt;You will lead a cross-functional team of 2 Product Managers and 1 Project Manager.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Challenges
      that await you&lt;/strong&gt;:&lt;/div&gt; &lt;ul&gt; &lt;li&gt;Own the product vision and long-term
      roadmap for the Communications Platform across all areas (In App Communications, Vendor Channels,
      Notification Center, Event Operations) and set the overall direction of the platform&lt;/li&gt;
      &lt;li&gt;Directly own the In App Communications area (Push, Pop-up, Banners) as product owner —
      shaping and prioritizing the backlog, tracking metrics, and driving releases&lt;/li&gt; &lt;li&gt;Lead
      and grow the team — development, goal-setting, and building the processes that let the team scale&lt;/li&gt;
      &lt;li&gt;Work closely with the product teams that consume the platform — Acquisition, Collection,
      and others — gathering their needs and factoring them into the&amp;nbsp;platform strategy and the
      In App Communications backlog&lt;/li&gt; &lt;li&gt;Improve the economics of the platform — the cost
      of service notifications, the balance of paid vs. free channels, and the rules for sending communications
      across channels&lt;/li&gt; &lt;li&gt;Drive platform performance — stability, delivery speed, and
      the speed of creating new notification events&lt;/li&gt; &lt;li&gt;Partner closely with Engineering
      on infrastructure, delivery, and integrations, making technical trade-offs together&lt;/li&gt; &lt;li&gt;Support
      the integration of new communication channels and the work with external providers (SMS, WhatsApp,
      Email)&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;strong&gt;What makes
      you a great fit&lt;/strong&gt;:&lt;/div&gt; &lt;ul&gt; &lt;li&gt;At least 1–2 years in a &lt;strong&gt;Product
      Lead&lt;/strong&gt; role&lt;/li&gt; &lt;li&gt;Proven experience developing platform products — not
      only user-facing or growth products — with a genuine platform mindset: infrastructure, scalability,
      stability, and the efficiency of internal processes&lt;/li&gt; &lt;li&gt;Strong product leadership:
      product strategy, long-term roadmap, and people management (you will manage a team of 3 from day
      one)&lt;/li&gt; &lt;li&gt;Strong stakeholder management and cross-functional communication — the
      ability to align the needs and priorities of the internal product teams that use the platform&lt;/li&gt;
      &lt;li&gt;The ability to work closely with Engineering — enough technical fluency to hold technical
      discussions and make trade-offs together with the team (an engineering background is not required)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;B2 or higher English&lt;/strong&gt; level for effective communication within
      an international team&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;Your bonus skills:&lt;/div&gt; &lt;ul&gt;
      &lt;li&gt;Experience with communication platforms (the ideal profile is a Product Lead of a communications
      platform)&lt;/li&gt; &lt;li&gt;Background in banking or fintech&lt;/li&gt; &lt;/ul&gt; &lt;div&gt;
