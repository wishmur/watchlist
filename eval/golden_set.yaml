  input:
    title: Senior Software Engineer, Solutions Engineering
    location: Remote, USA
    raw_jd: '&lt;p&gt;Omada Health is on a mission to bend the curve of chronic disease.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Job
      overview:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Omada Health is a digital care provider that empowers
      people to achieve their health goals through sustainable behavioral change.&lt;/p&gt; &lt;p&gt;We’re
      looking for a senior software engineer to join our Solutions Engineering Team. Our primary function
      is to understand customer challenges, design tailored technical solutions using Omada&#39;s products
      and systems, and demonstrate the value and feasibility of those solutions.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Your
      Impact:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Shape complex, cross-system integrations.
      Be involved early on high-complexity, cross-system work (e.g., partner/alliance integration APIs)
      that requires understanding how systems should fit together and the operational implications of
      the design.&lt;/li&gt; &lt;li&gt;&amp;nbsp;Spot the pattern behind recurring toil and define the
      reusable templates, standards, and automation the rest of the team builds on. Know when to loop
      in the engineers who own a given system, and reconcile competing constraints.&lt;/li&gt; &lt;li&gt;Get
      to the real root cause. Go beyond the immediate fix to determine whether the true cause is architectural,
      a monitoring gap, or a process failure and drive the fix (and the follow-up action items) so it
      doesn’t recur.&lt;/li&gt; &lt;li&gt;Mentor the team — including non-engineers. Be the go-to person
      for coding guidance and growth for the team’s members who don’t have a formal software engineering
      background but write code and build automations as part of their role.&lt;/li&gt; &lt;li&gt;Drive
      delivery decisions with stakeholders. Partner directly with commercial, product, and engineering
      stakeholders to scope solutions that fit real timeframes and constraints, and make the call on technical
      trade-offs for delivery.&lt;/li&gt; &lt;li&gt;Navigate ambiguity. Take on problems that show up
      without a clear spec — ask the right clarifying questions, scope the actual work, and create a technical
      plan the team can execute against.&lt;/li&gt; &lt;li&gt;Surface risk early and document deeply.
      Identify risks, edge cases, security concerns, and downstream impacts as part of discovery, and
      make sure deep-dive knowledge lives in runbooks.&lt;/li&gt; &lt;li&gt;Participate in our on-call
      rotation; triage and address issues that come up supporting members, ensuring timely resolutions
      and assisting internal teams in their investigations.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;About
      you:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;5–8 years writing readable, tested, and efficient
