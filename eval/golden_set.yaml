      at a speed and quality that wasn&#39;t previously possible.&lt;/p&gt; &lt;p&gt;Named a Leader in
      the 2026 Gartner® Magic Quadrant™ for Customer Data Platforms, Hightouch is trusted by leading enterprises
      like Domino&#39;s, Spotify, Aritzia, Cars.com, Ramp, and PetSmart.&lt;/p&gt; &lt;p&gt;At Hightouch,
      our mission is to help our customers leverage data and AI to grow their businesses. The team is
      ambitious, impact-driven, efficient — and we believe humility, kindness, and compassion are essential
      to our success. If you&#39;re energized by velocity, obsessed with raising the bar, and want to
      build alongside people who care deeply about each other and our customers, we&#39;d love to meet
      you.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;About the Product Team&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;You’ll join a lean, world-class Product Team. We’ve thought deeply about what winning product
      culture looks like in competitive markets being reshaped by AI. The team prizes founder-level commercial
      instinct, the bandwidth to cover broad areas, and extremely fast iteration aided by product-minded
      engineers and AI. We’re the team that invented Reverse ETL, pioneered the Composable architecture,
      landed AI Decisioning as a category, and most recently invented Agentic Marketing.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Why
      this role matters&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;This portfolio is the majority of Hightouch&#39;s
