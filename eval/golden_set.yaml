  input:
    title: Senior Product Manager - A2A & Money Movement
    location: Remote, US
    raw_jd: '&lt;p&gt;As Senior Product Manager on the A2A &amp;amp; Money Movement team, you own the
      roadmap and execution for a defined set of A2A payment capabilities at NMI. You&#39;ll work closely
      with Engineering, Design, Compliance, and go-to-market teams to ship products that make bank-direct
      payments simpler, faster, and more reliable for our partners and their merchants. This role requires
      someone who can run a customer discovery session, write a tight spec, and dig into transaction data—without
      waiting to be asked.&lt;/p&gt; &lt;h3&gt;About NMI&lt;/h3&gt; &lt;p&gt;NMI, a global leader in payment
      technologies, allows software and sales professionals to deliver payment innovations to their clients
      without having to build payment expertise in house. NMI enables our partners with choice, and challenges
      the one-size-fits-all approach to payments. You&#39;ve probably used NMI in the last 24 hours without
      even realizing it. We&#39;re the platform that powers success for innovative tech created by SMBs,
      entrepreneurs and fintech startups. We&#39;re creative problem solvers who help visionaries smash
      through boundaries and think beyond what&#39;s possible so they can think about what&#39;s next.
      But we&#39;re not just built for the tech savvy. We democratize the latest payments technology so
      that everyone can realize the benefits of easy payments across the full spectrum of commerce. Our
      mission is to use our expertise to enable more payments, in more ways and more places. We provide
      ISOs, Fintech Innovators and Technologists the freedom to focus on what they do best, liberating
      them from restricted payment solutions and giving them access to the latest payment technology now
      and in the future.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;How We Work - Our Core Values&lt;/strong&gt;&lt;/h3&gt;
      &lt;p&gt;* &lt;strong&gt;Be a Good Person, It&#39;s Simple.&lt;/strong&gt; We treat everyone fairly
      and with respect. We lead with kindness, humility and integrity. We take the time to understand
      each other and our customers. And we serve with care, because customers are never a transaction,
      and always our focus&lt;/p&gt; &lt;p&gt;* &lt;strong&gt;Align, Trust &amp;amp; Go. &lt;/strong&gt;We
      debate openly, &amp;nbsp;listen carefully and challenge thoughtfully. Once we decide, we move forward
      together - holding ourselves accountable to our commitments, and focusing on what matters most to
      our customers. That alignment creates momentum.&lt;/p&gt; &lt;p&gt;* &lt;strong&gt;Raise the Bar.
      &lt;/strong&gt;Good enough isn&#39;t enough. We stay curious, measure everything, stay honest about
      progress and keep pushing ourselves to think creatively.&amp;nbsp;We drive change, again and again.
      And leave things better than we found them. When we raise the bar, our customers feel it too.&lt;/p&gt;
      &lt;h3&gt;&lt;strong&gt;About the Team&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;The A2A Money Movement
      team is building one of NMI&#39;s highest-growth product areas. As real-time payment rails mature—FedNow,
      RTP, ACH, open banking, push-to-card—our partners are demanding bank-direct payment options that
      reduce interchange costs, accelerate settlement, and unlock entirely new merchant use cases: disbursements,
      earned wage access, insurance payouts, B2B collections, marketplaces, escrow holding, and more.&lt;/p&gt;
      &lt;p&gt;This team was established through NMI&#39;s acquisition of Dwolla, a leading ACH and real-time
      payments platform. You will inherit a strong foundation, live product, existing rails and relationships,
      and a seasoned team to build upon and scale within NMI&#39;s broader partner ecosystem.&lt;/p&gt;
      &lt;p&gt;This team owns NMI&#39;s strategy and execution across all money movement modalities: ACH
      (standard and same-day), real-time payments (RTP/FedNow), push-to-card, open banking / pay-by-bank,
      bank account verification, and cross-border transfers. This is not a maintenance role—it is a build
      role. You will be setting strategy in a space that is moving fast, with real revenue implications
      and growing partner demand.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;You will:&lt;/strong&gt;&lt;/h3&gt;
      &lt;ul&gt; &lt;li&gt;Own the roadmap for your product domain within A2A—maintaining a well-prioritized
      backlog, a clear rationale for every decision, and a delivery plan that the team can execute against&lt;/li&gt;
      &lt;li&gt;Define and prioritize features based on partner needs, transaction data, competitive signals,
      and business impact&lt;/li&gt; &lt;li&gt;Maintain continuity of existing Dwolla customer commitments
      while contributing to NMI integration milestones — balancing BAU stability with forward progress&amp;nbsp;&lt;/li&gt;
      &lt;li&gt;Write clear, detailed product requirements and acceptance criteria; run scoping sessions
      with Engineering that result in shared understanding and no surprises&lt;/li&gt; &lt;li&gt;Lead
      product discovery: customer interviews, partner feedback sessions, competitive teardowns, and data
      analysis—then synthesize findings into a point of vie'
