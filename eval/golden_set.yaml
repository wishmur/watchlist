      a while, electrifying it, digitizing it, and loading it with American innovation. Respect for communities
      by creating a company that stands for its people and its customers. Respect for both work and play,
      with vehicles that are equally at home at a camp site, a job site, or on a Tuesday commute. And
      respect for our customers by developing two powertrains that meet their requirements — an all-electric
      powertrain as well as the Harvester™ range extender powertrain which includes a built-in gas-powered
      generator with an estimated 500 miles of combined range.&lt;/p&gt; &lt;p&gt;At Scout Motors, we
      empower our talented, inclusive, and entrepreneurial teams to innovate. What makes a Scout employee?
      Someone who is a visionary and a leader, who seeks new paths and shares lessons learned. A knowledgeable
      doer who collaborates across the company to build better. A go-getter with unrivaled passion.&lt;/p&gt;
      &lt;p&gt;Join us at Scout Motors and be part of shaping the future of transportation. If you&#39;re
      ready to drive change and make history, apply now!&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;span data-contrast=&quot;auto&quot;&gt;Join
      an iconic brand set to redefine the pick-up truck and rugged SUV marketplace. As a Staff Technical
      Product Manager, you will play a pivotal role in shaping Scout’s consumer facing digital product
      experiences. This high-visibility, strategic, and technical role bridges engineering, product management,
