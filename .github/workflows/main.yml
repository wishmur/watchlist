# RETIRED — superseded by board.yml, which runs ingest + classify at 6:30 AM PT.
#
# The schedule is removed rather than the file, so this stays runnable by hand
# if the new pipeline ever needs comparing against it. Leaving the cron would
# have run the old two-tier fit scorer every morning alongside the new
# pipeline: Haiku + Sonnet calls against profile/candidate_profile.md, writing
# `matches` rows nothing reads any more — a daily Anthropic bill for output the
# board does not use.
#
# fetch_and_score.py is unchanged and still works. Delete both once the new
# pipeline has a few clean runs behind it.
name: Watchlist — daily job fetch + score (RETIRED)

on:
  workflow_dispatch:

jobs:
  fetch-and-score:
    name: Fetch jobs + score with Claude
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install httpx

      - name: Run pipeline
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_and_score.py
