      is a FinTech company that has grown to over 75M (as of August 2026) users since its launch in 2018.
      Our team is hugely diverse with members from over 50 different countries.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;OUR
      VISION IS UNLIMITED_&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We dare to believe that we do not need a
